name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: artifacts
      - uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  publish-github-packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: artifacts
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="$RUNNER_TEMP/github-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" --name github --configfile "$config"
          export NuGetPackageSourceCredentials_github="Username=$GITHUB_ACTOR;Password=$GH_TOKEN;ValidAuthenticationTypes=Basic"
          dotnet nuget push artifacts/*.nupkg --source github --configfile "$config" --api-key "$GH_TOKEN" --skip-duplicate

  attach-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: artifacts
      - name: Attach package to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package=(artifacts/*.nupkg)
          name=${package[0]##*/}
          digest="sha256:$(sha256sum "${package[0]}" | cut -d ' ' -f 1)"
          asset=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" |
            jq -c --arg name "$name" '[.[][] | select(.name == $name)] | first // empty')
          if [[ -n "$asset" ]]; then
            if jq -e --arg digest "$digest" '.state == "uploaded" and .digest == $digest' <<< "$asset" > /dev/null; then
              exit 0
            fi
            if jq -e '.state == "starter" and .size == 0' <<< "$asset" > /dev/null; then
              asset_id=$(jq -r '.id' <<< "$asset")
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --silent
            else
              echo "Release asset $name already exists with different content." >&2
              exit 1
            fi
          fi
          gh release upload "$RELEASE_TAG" "${package[0]}" --repo "$GITHUB_REPOSITORY"
