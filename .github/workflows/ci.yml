name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Reuse the package on a release retry
        if: inputs.release-tag != '' && github.run_attempt != '1'
        id: reuse-package
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: package
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/checkout@v7.0.1
        if: steps.reuse-package.outcome != 'success'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        if: steps.reuse-package.outcome != 'success'
        with:
          global-json-file: global.json
      - name: Restore, build, test and pack
        if: steps.reuse-package.outcome != 'success'
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          version="${RELEASE_TAG:-0.0.0-ci}"
          dotnet restore -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet build -c Release --no-restore -p:Version="$version" -p:ContinuousIntegrationBuild=true
          dotnet test -c Release --no-build
          dotnet pack src/Yandex.Dialogs.Models.csproj -c Release --no-build -o package \
            -p:Version="$version" -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.release-tag != '' && steps.reuse-package.outcome != 'success'
        with:
          name: nuget-package
          path: package/*.nupkg
          if-no-files-found: error
          retention-days: 30
